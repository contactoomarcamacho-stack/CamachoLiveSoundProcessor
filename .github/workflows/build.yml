name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target CamachoLiveSoundProcessor_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: Camacho-Live-Sound-Processor-VST3
          path: build/CamachoLiveSoundProcessor_artefacts/Release/VST3/**
          if-no-files-found: error
