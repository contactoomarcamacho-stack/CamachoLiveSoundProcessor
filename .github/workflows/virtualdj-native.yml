name: Build VPX PRO for VirtualDJ 64-bit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VirtualDJ/**'
      - '.github/workflows/virtualdj-native.yml'
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Download official VirtualDJ SDK v8
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://virtualdj.com/developers/VirtualDJ8_SDK_20211003.zip" -OutFile "vdj-sdk.zip"
          Expand-Archive -Path "vdj-sdk.zip" -DestinationPath "vdj-sdk"
          Get-ChildItem vdj-sdk -Recurse -Filter vdjDsp8.h
          Get-Content vdj-sdk/vdjPlugin8.h
      - name: Compile native 64-bit DLL
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /O2 /LD /I "vdj-sdk" "VirtualDJ\VPXNative.cpp" /link user32.lib gdi32.lib /OUT:VPX_PRO_MASTERING_PROCESSOR.dll
      - name: Compile and run native DSP stress tests
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /O2 /W4 /I "VirtualDJ" "VirtualDJ\VPXLimiterTests.cpp" /Fe:VPXLimiterTests.exe
          VPXLimiterTests.exe
      - uses: actions/upload-artifact@v4
        with:
          name: VPX-PRO-VirtualDJ-64bit-DLL
          path: VPX_PRO_MASTERING_PROCESSOR.dll
          if-no-files-found: error
